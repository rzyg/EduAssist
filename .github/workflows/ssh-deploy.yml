name: Test Remote Connection (SSH + scp)

on:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: windows-latest
    steps:
      # 1. 准备 SSH 私钥
      - name: Setup SSH key
        shell: bash
        run: |
          mkdir -p "$USERPROFILE/.ssh"
          SSH_KEY_PATH="$USERPROFILE/.ssh/deploy_key"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"

      # 2. 测试 SSH 连接
      - name: Test SSH connection
        shell: bash
        run: |
          SSH_KEY_PATH="$USERPROFILE/.ssh/deploy_key"
          ssh -p ${{ secrets.DEPLOY_PORT }} \
              -i "$SSH_KEY_PATH" \
              -o StrictHostKeyChecking=no \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "echo '✅ SSH connection successful'; whoami; hostname"

      # 3. 测试 scp 文件传输（替代 rsync）
      - name: Test scp transfer
        shell: bash
        run: |
          SSH_KEY_PATH="$USERPROFILE/.ssh/deploy_key"
          # 创建测试文件
          echo "Test file content $(date)" > test.txt

          # 使用 scp 上传文件
          scp -P ${{ secrets.DEPLOY_PORT }} \
              -i "$SSH_KEY_PATH" \
              -o StrictHostKeyChecking=no \
              test.txt \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_TARGET }}/test_upload.txt

          # 验证远程文件存在
          ssh -p ${{ secrets.DEPLOY_PORT }} \
              -i "$SSH_KEY_PATH" \
              -o StrictHostKeyChecking=no \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "ls -lh ${{ secrets.DEPLOY_TARGET }}/test_upload.txt && echo '✅ File uploaded successfully'"