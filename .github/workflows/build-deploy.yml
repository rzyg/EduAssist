name: Build and Deploy EduAssist

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: false
        default: 'v0.0.1'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python ─────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r core/requirements.txt

      # ── Node.js / pnpm ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ── Rust ──────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.92.0'

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Cargo build (Tauri)
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock', 'src-tauri/src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      # ── 构建 ──────────────────────────────────────────────
      - name: Cache Nuitka build
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache\
          key: ${{ runner.os }}-nuitka-${{ hashFiles('core/**/*.py', 'core/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Build Python with Nuitka
        run: |
          python -m nuitka --standalone --output-dir=pydist --output-filename=main `
            --enable-plugin=no-qt --follow-imports --lto=no --remove-output --jobs=0 `
            core/main.py --windows-console-mode=disable --include-package=openpyxl `
            --assume-yes-for-downloads

      - name: Verify Python build
        run: |
          if (Test-Path "pydist\main.dist\main.exe") {
            Write-Host "✅ Python build successful"
          } else {
            Write-Error "❌ pydist\main.exe not found"
            exit 1
          }

      - name: Build Tauri (frontend + Rust + NSIS bundle)
        run: pnpm tauri build

      - name: Verify installer exists
        run: |
          $installerDir = "src-tauri\target\release\bundle\nsis"
          if (Test-Path $installerDir) {
            $files = Get-ChildItem -Path $installerDir -Filter "*.exe"
            Write-Host "✅ Found $($files.Count) installer(s)"
          } else {
            Write-Error "❌ Installer directory not found"
            exit 1
          }

      # ── 发布到 GitHub Release ──────────────────────────────
      - name: Upload NSIS installer to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true

      # ── 部署到远程服务器（使用 scp 替代 rsync）─────────────
      - name: Deploy via scp
        id: deploy
        shell: bash
        run: |
          mkdir -p "$USERPROFILE/.ssh"
          SSH_KEY_PATH="$USERPROFILE/.ssh/deploy_key"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"

          INSTALLER=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "❌ No installer found"
            exit 1
          fi
          echo "📦 Uploading: $INSTALLER"

          scp -P ${{ secrets.DEPLOY_PORT }} \
              -i "$SSH_KEY_PATH" \
              -o StrictHostKeyChecking=no \
              "$INSTALLER" \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_TARGET }}/

          ssh -p ${{ secrets.DEPLOY_PORT }} \
              -i "$SSH_KEY_PATH" \
              -o StrictHostKeyChecking=no \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "ls -lh ${{ secrets.DEPLOY_TARGET }}/$(basename "$INSTALLER") && echo '✅ Deployment successful'"

      # ── 生成并推送 .version.json ───────────────────────────
      - name: Generate and upload .version.json
        if: steps.deploy.outcome == 'success'
        shell: bash
        run: |
          SSH_KEY_PATH="$USERPROFILE/.ssh/deploy_key"

          # 版本号（tag push / workflow_dispatch）
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.tag_name }}"
            VERSION="${VERSION#v}"
          fi
          [ -z "$VERSION" ] && VERSION="0.0.1"
          echo "Version: $VERSION"

          # 安装包文件名 + 下载直链
          INSTALLER=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          INSTALLER_NAME=$(basename "$INSTALLER")
          DOWNLOAD_URL="https://alist.bbts.fun/d/下班工具箱/${INSTALLER_NAME}"

          # 更新日志
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              RAW_LOG=$(git log --oneline --no-decorate "${PREV_TAG}..${GITHUB_REF_NAME}" 2>/dev/null || git log --oneline --no-decorate -10)
            else
              RAW_LOG=$(git log --oneline --no-decorate -10)
            fi
          else
            RAW_LOG="manual build $VERSION"
          fi

          # 清理特殊字符：双引号→单引号，反斜杠→正斜杠，换行→\n
          CLEAN=$(echo "$RAW_LOG" | sed 's/"/'"'"'/g; s/\\/\//g' | sed ':a;N;$!ba;s/\n/\\n/g')
          CHANGELOG_MD="## 更新内容\\n${CLEAN}"

          # 用 printf 拼 JSON
          printf '{\n' > .version.json
          printf '  "version": "%s",\n' "$VERSION" >> .version.json
          printf '  "changelog": "%s",\n' "$CHANGELOG_MD" >> .version.json
          printf '  "download_url": "%s"\n' "$DOWNLOAD_URL" >> .version.json
          printf '}\n' >> .version.json

          echo "=== .version.json ==="
          cat .version.json

          # 上传覆盖
          scp -P ${{ secrets.DEPLOY_PORT }} \
              -i "$SSH_KEY_PATH" \
              -o StrictHostKeyChecking=no \
              .version.json \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_TARGET }}/.version.json

          echo "uploaded"

      - name: Print success message
        if: success()
        shell: powershell
        run: |
          Write-Host "✅ Build and deployment finished at $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"

      - name: Check deployment status
        if: always()
        shell: powershell
        run: |
          if ("${{ steps.deploy.outcome }}" -eq "success") {
            Write-Host "✅ Deployment succeeded"
          } else {
            Write-Error "❌ Deployment failed"
            exit 1
          }