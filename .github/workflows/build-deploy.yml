name: Build and Deploy EduAssist

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python ─────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r core/requirements.txt

      # ── Node.js / pnpm ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ── Rust (Tauri 需要) ──────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.92.0'

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo build (Tauri)
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('src-tauri/**') }}

      # ── 构建步骤 ──────────────────────────────────────────
      - name: Build Python with Nuitka
        run: |
          python -m nuitka --standalone --output-dir=pydist --output-filename=main --enable-plugin=no-qt --follow-imports --lto=yes --remove-output --jobs=0 core/main.py --windows-disable-console --include-package=openpyxl --assume-yes-for-downloads

      - name: Build Tauri (frontend + Rust + NSIS bundle)
        # tauri build 自动执行 beforeBuildCommand（复制 pydist + 构建前端），
        # 然后编译 Rust 并生成 NSIS 安装包
        run: pnpm tauri build

      # ── 发布到 GitHub Release ──────────────────────────────
      - name: Upload NSIS installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 部署到服务器 ───────────────────────────────────────
      - name: Configure SSH key
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\.ssh"
          Set-Content -Path "$HOME\.ssh\deploy_key" -Value "${{ secrets.SSH_PRIVATE_KEY }}"
          icacls "$HOME\.ssh\deploy_key" /inheritance:r /grant "$env:USERNAME:R"

      - name: Deploy NSIS installer via scp
        shell: powershell
        run: |
          $files = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -File
          if ($files.Count -eq 0) {
            Write-Error "No installer files found in src-tauri\target\release\bundle\nsis"
            exit 1
          }
          foreach ($file in $files) {
            scp -o StrictHostKeyChecking=accept-new -P 9022 -i "$HOME\.ssh\deploy_key" `
              $file.FullName `
              ecs-user@ea-docs.bbts.fun:/home/ecs-user/www/eduassist/
          }

      - name: Print success message
        run: echo "Build and deployment finished at $(Get-Date)"