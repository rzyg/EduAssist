name: Build and Deploy EduAssist

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # 手动触发时，允许输入自定义 Tag 名称用于发布
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: false
        default: 'v0.0.1'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      contents: write  # 授予创建 Release 的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取所有历史，确保 Tag 信息完整

      # ── Python ─────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r core/requirements.txt

      # ── Node.js / pnpm ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ── Rust (Tauri 需要) ──────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.92.0'

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Cargo build (Tauri)
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          # 仅对关键文件计算哈希，避免缓存永久失效
          key: ${{ runner.os }}-tauri-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock', 'src-tauri/src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      # ── 构建步骤 ──────────────────────────────────────────
      - name: Cache Nuitka build
        uses: actions/cache@v5  # 注意：最新版是 v5，但 v4 也支持
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache\
          key: ${{ runner.os }}-nuitka-${{ hashFiles('core/**/*.py', 'core/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Build Python with Nuitka
        run: |
          python -m nuitka --standalone --output-dir=pydist --output-filename=main `
            --enable-plugin=no-qt --follow-imports --lto=no --remove-output --jobs=0 `
            core/main.py --windows-console-mode=disable --include-package=openpyxl `
            --assume-yes-for-downloads

      - name: Verify Python build
        run: |
          if (Test-Path "pydist\main.dist\main.exe") {
            Write-Host "✅ Python build successful"
          } else {
            Write-Error "❌ pydist\main.exe not found"
            exit 1
          }

      - name: Build Tauri (frontend + Rust + NSIS bundle)
        run: pnpm tauri build

      - name: Verify installer exists
        run: |
          $installerDir = "src-tauri\target\release\bundle\nsis"
          if (Test-Path $installerDir) {
            $files = Get-ChildItem -Path $installerDir -Filter "*.exe"
            Write-Host "✅ Found $($files.Count) installer(s)"
          } else {
            Write-Error "❌ Installer directory not found"
            exit 1
          }

      # ── 发布到 GitHub Release ──────────────────────────────
      - name: Upload NSIS installer to GitHub Release
        # 仅在推送 Tag 时运行，手动触发时跳过（避免缺少 Tag 报错）
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
        # GITHUB_TOKEN 由 permissions 自动提供，无需显式设置

      - name: Deploy via rsync
        if: success()
        uses: easingthemes/ssh-deploy@v6.0.3
        id: deploy
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: '-avzr'
          SOURCE: 'src-tauri/target/release/bundle/nsis/'
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: ${{ secrets.DEPLOY_PORT }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          SCRIPT_BEFORE: |
            mkdir -p ${{ secrets.DEPLOY_TARGET }}
            echo "📁 Target directory ready"
          SCRIPT_AFTER: |
            echo "📁 Deployed files:"
            ls -lh ${{ secrets.DEPLOY_TARGET }}
            
            if ls ${{ secrets.DEPLOY_TARGET }}/*.exe 1> /dev/null 2>&1; then
              echo "✅ .exe file successfully deployed"
            else
              echo "⚠️ No .exe file found in target directory"
            fi
            
            echo ""
            echo "✅ Deployment finished at $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Print success message
        if: success()
        shell: powershell
        run: |
          Write-Host "✅ Build and deployment finished at $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"

      - name: Check deployment status
        if: always()
        shell: powershell
        run: |
          if ("${{ steps.deploy.outcome }}" -eq "success") {
            Write-Host "✅ Deployment succeeded"
          } else {
            Write-Error "❌ Deployment failed"
            exit 1
          }